server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Health check for Coolify / Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /services/ has no index page of its own; send it to the overview
    location = /services/ {
        return 301 /services.html;
    }

    # Pages: clean URLs work too (/about serves about.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # CSS and JS carry a ?v= version in the HTML, so they can be cached for a long time
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Fonts and images
    location ~* \.(?:woff2|jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
